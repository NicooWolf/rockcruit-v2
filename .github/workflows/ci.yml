# Quality gate. Runs on every pull request to dev and to main.
# The rulesets on dev and main require the "Check and build" check.
name: CI

on:
  pull_request:
    branches: ["main", "dev"]
  workflow_dispatch:

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - name: Check types and Astro syntax
        run: npx astro check
      - name: Lint
        run: npm run lint
      - name: Build without network
        run: npm run build
        env:
          BLOG_ENABLED: "false"
